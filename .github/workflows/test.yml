name: Run Tests

on:
  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run only changed tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx jest --changedSince=origin/dev

      - name: Run all tests (last resort fallback)
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx jest
