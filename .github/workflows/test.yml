name: Run Tests

on:
  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Debug Jest test matching
        run: npx jest --listTests

      - name: Run specific test (manual fallback)
        run: npx jest src/modules/auth/controllers/__tests__/auth.controller.test.ts

      - name: Run all tests (last resort fallback)
        run: npx jest
